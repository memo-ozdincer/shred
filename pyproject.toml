[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-prefix"
version = "0.1.0"
description = "Exact shared-prefix execution for batches of complete Lean proofs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lean-prefix = "lean_prefix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

